name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  merge-and-verify:
    name: merge SSTs, ingest into RocksDB, verify data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest's apt `rocksdb-tools` is RocksDB 8.9.1 (noble), too old
      # to read format_version=7 SSTs (added in RocksDB 10.4.0) — this
      # crate's writer targets 7 (see sst_builder.rs FORMAT_VERSION), so an
      # apt-installed sst_dump/ldb rejects its own output with "Corrupt or
      # unsupported format_version: 7". Use Homebrew instead: its `rocksdb`
      # formula tracks upstream releases (11.1.2 as of writing, same version
      # already verified locally on macOS) and understands format_version 7.
      # Homebrew (Linuxbrew) is preinstalled on GitHub's ubuntu-latest
      # runners but NOT on PATH by default (confirmed against the
      # actions/runner-images Ubuntu 24.04 readme) — `brew shellenv` must be
      # eval'd into $GITHUB_PATH/$GITHUB_ENV for later steps to see it.
      - name: Install RocksDB CLI tools (ldb, sst_dump)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          brew install rocksdb

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release

      # crates/fuzzer/tests/rocksdb_oracle.rs is the actual end-to-end
      # workflow: run a real workload against RocksDB, snapshot the
      # pre-compaction SSTs, merge them with compactor's own compact_files
      # binary, ingest the result into a fresh RocksDB instance (and,
      # separately, drop it straight into an existing DB's directory and let
      # `ldb repair` rebuild the manifest — RocksDB's own file-driven
      # recovery path, the closest thing to "reboot RocksDB" without an
      # actual server process), then diff what RocksDB reads back against
      # ground truth captured before compaction ever ran.
      - name: Merge SSTs with compact_files, boot RocksDB, verify data
        run: |
          set -o pipefail
          cargo test --release -p fuzzer --test rocksdb_oracle -- --nocapture 2>&1 | tee test_output.log
          if grep -q "^SKIP:" test_output.log; then
            echo "::error::rocksdb_oracle test skipped (ldb/sst_dump not found on PATH) — CI must not silently skip this"
            exit 1
          fi
